# 1. Der USB-Empfänger (Bleibt so)
sensor:
  - platform: serial
    serial_port: /dev/ttyACM0
    baudrate: 115200

# 2. Die Auswertung mit "Unique ID" und verbessertem Filter
template:
  - sensor:
      - name: "Arbeitsplatz Helligkeit"
        unique_id: "arbeitsplatz_lux_usb"
        unit_of_measurement: "V"
        state: >
          {% set val = states('sensor.serial_sensor') %}
          {% if 'VALUE_LUX:' in val %}
            {# Schneidet die Farbcodes [0m etc. ab #}
            {{ val.split('VALUE_LUX:')[1].split('[')[0].strip() | float(default=0) }}
          {% else %}
            {{ states('sensor.arbeitsplatz_helligkeit_esp') }}
          {% endif %}

      - name: "Arbeitsplatz Temperatur"
        unique_id: "arbeitsplatz_temp_usb"
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set val = states('sensor.serial_sensor') %}
          {% if 'VALUE_TEMP:' in val %}
            {{ val.split('VALUE_TEMP:')[1].split('[')[0].strip() | float(default=0) }}
          {% else %}
            {{ states('sensor.arbeitsplatz_temperatur_esp') }}
          {% endif %}

      - name: "Arbeitsplatz Luftfeuchtigkeit"
        unique_id: "arbeitsplatz_hum_usb"
        unit_of_measurement: "%"
        device_class: humidity
        state: >
          {% set val = states('sensor.serial_sensor') %}
          {% if 'VALUE_HUM:' in val %}
            {{ val.split('VALUE_HUM:')[1].split('[')[0].strip() | float(default=0) }}
          {% else %}
            {{ states('sensor.arbeitsplatz_luftfeuchtigkeit_esp') }}
          {% endif %}